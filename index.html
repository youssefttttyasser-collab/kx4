<!doctype html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>هجمة مرتدة</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:Arial,sans-serif;padding:18px}header{text-align:center;border-bottom:2px solid #e32636;padding:12px}h1{color:#ef2938;margin:8px}p{color:#aaa}.stats,.devices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0}.stat,.device{background:#171717;border:1px solid #333;border-radius:14px;padding:16px}.stat b{font-size:23px;color:#ff3949}.top{display:flex;justify-content:space-between;align-items:center}.status{color:#57d68d}.busy{color:#ff5360}label{display:block;margin:10px 0 5px;color:#bbb}select,input,button{background:#252525;color:white;border:1px solid #444;border-radius:8px;padding:10px;font-size:15px}select,input{width:100%}.dur{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}button{cursor:pointer;margin-top:12px;width:100%;background:#c51e2c;border:0;font-weight:bold}.stop{background:#555}.timer{font-size:27px;color:#ff4757;text-align:center;margin:12px}.muted{color:#aaa;font-size:13px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:10px;border-bottom:1px solid #333;text-align:center}th{color:#ff6874}.history{overflow:auto;background:#171717;border-radius:12px;padding:10px}h2{margin-top:25px}
</style>
<header><h1>هجمة مرتدة</h1><p>إدارة جلسات 9 أجهزة بلايستيشن</p></header>
<section class="stats"><div class="stat">دخل اليوم<br><b id="total">0 ج.م</b></div><div class="stat">جلسات اليوم<br><b id="count">0</b></div><div class="stat">أجهزة مشغولة<br><b id="busy">0 / 9</b></div></section>
<h2>الأجهزة</h2><section class="devices" id="devices"></section>
<h2>سجل الجلسات</h2><button id="csv">تصدير السجل CSV</button><div class="history"><table><thead><tr><th>الجهاز</th><th>النوع</th><th>البداية</th><th>النهاية</th><th>المدة</th><th>الحساب</th></tr></thead><tbody id="history"></tbody></table></div>
<p class="muted">الأسعار للساعة: سنجل 15، ملتي 25، بلياردو 60، الجيم 10 جنيه. الحفظ على نفس المتصفح والجهاز فقط.</p>
<script>
const rates={single:15,multi:25,billiardo:60,gym:10},names={single:"سنجل",multi:"ملتي",billiardo:"بلياردو",gym:"الجيم"},key="hagma_mortadda_v1";
let db=JSON.parse(localStorage.getItem(key)||'{"active":{},"sessions":[]}');
const save=()=>localStorage.setItem(key,JSON.stringify(db)),money=n=>(Math.round(n*100)/100).toFixed(2)+" ج.م",date=t=>new Date(t).toLocaleString("ar-EG"),dur=ms=>{let s=Math.floor(ms/1000);return Math.floor(s/3600)+" س "+Math.floor(s%3600/60)+" د "+s%60+" ث"};
function finish(i){let a=db.active[i];if(!a)return;let end=Date.now(),ms=end-a.start;db.sessions.unshift({device:i,type:a.type,start:a.start,end,duration:ms,amount:ms/3600000*rates[a.type]});delete db.active[i];save();render()}
function render(){let root=document.getElementById("devices");root.innerHTML="";
for(let i=1;i<=9;i++){let a=db.active[i],card=document.createElement("article");card.className="device";card.innerHTML='<div class="top"><h3>جهاز '+i+'</h3><b class="'+(a?'busy':'status')+'">'+(a?'شغال':'متاح')+'</b></div>';
if(!a){card.innerHTML+='<label>نوع الجلسة</label><select class="type"><option value="single">سنجل — 15 ج/ساعة</option><option value="multi">ملتي — 25 ج/ساعة</option><option value="billiardo">بلياردو — 60 ج/ساعة</option><option value="gym">الجيم — 10 ج/ساعة</option></select><label>المدة (ساعات / دقائق / ثواني)</label><div class="dur"><input class="h" type="number" min="0" value="1"><input class="m" type="number" min="0" max="59" value="0"><input class="s" type="number" min="0" max="59" value="0"></div><p class="muted estimate"></p><button>بدء الجلسة</button>';
let btn=card.querySelector("button"),calc=()=>{let ms=(+card.querySelector(".h").value*3600+(+card.querySelector(".m").value)*60+(+card.querySelector(".s").value))*1000;card.querySelector(".estimate").textContent="السعر المتوقع: "+money(ms/3600000*rates[card.querySelector(".type").value])};card.querySelectorAll("input,select").forEach(x=>x.oninput=calc);calc();btn.onclick=()=>{let ms=(+card.querySelector(".h").value*3600+(+card.querySelector(".m").value)*60+(+card.querySelector(".s").value))*1000;if(ms<=0)return alert("حدد مدة صحيحة");let start=Date.now();db.active[i]={type:card.querySelector(".type").value,start,end:start+ms};save();render()}}
else{card.innerHTML+='<div class="timer" id="t'+i+'">00:00:00</div><p class="muted">بدأت: '+date(a.start)+'<br>تنتهي: '+date(a.end)+'<br>الحساب الحالي: <b id="c'+i+'"></b></p><button class="stop">إنهاء الجلسة</button>';card.querySelector("button").onclick=()=>finish(i)}
root.appendChild(card)}
let today=new Date().toDateString(),rows=db.sessions.filter(x=>new Date(x.end).toDateString()===today);document.getElementById("total").textContent=money(rows.reduce((s,x)=>s+x.amount,0));document.getElementById("count").textContent=rows.length;document.getElementById("busy").textContent=Object.keys(db.active).length+" / 9";
document.getElementById("history").innerHTML=db.sessions.slice(0,100).map(x=>'<tr><td>جهاز '+x.device+'</td><td>'+names[x.type]+'</td><td>'+date(x.start)+'</td><td>'+date(x.end)+'</td><td>'+dur(x.duration)+'</td><td>'+money(x.amount)+'</td></tr>').join("")}
function tick(){let now=Date.now();for(let [i,a] of Object.entries({...db.active})){if(now>=a.end){finish(i);continue}let sec=Math.floor((now-a.start)/1000),el=document.getElementById("t"+i);if(el)el.textContent=[Math.floor(sec/3600),Math.floor(sec%3600/60),sec%60].map(v=>String(v).padStart(2,"0")).join(":");let c=document.getElementById("c"+i);if(c)c.textContent=money((now-a.start)/3600000*rates[a.type])}}
document.getElementById("csv").onclick=()=>{let rows=[["الجهاز","النوع","البداية","النهاية","المدة","الحساب"],...db.sessions.map(x=>["جهاز "+x.device,names[x.type],date(x.start),date(x.end),dur(x.duration),x.amount])];let blob=new Blob(["\ufeff"+rows.map(r=>r.join(",")).join("\n")],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="سجل-هجمة-مرتدة.csv";a.click();URL.revokeObjectURL(url)};
render();setInterval(tick,1000);tick();
</script></html>
